<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petrol stations by region</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { height: 100%; margin: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #14161c; color: #f2f0ea; }
  #wrap { display: flex; height: 100%; }
  #map { flex: 1; }
  #side { width: 300px; overflow-y: auto; padding: 14px 16px; border-left: 1px solid #343946; font-size: 13px; }
  h1 { font-size: 17px; margin: 0 0 4px; } p { color: #9aa0ad; margin: 0 0 12px; }
  .r { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2e38; cursor: pointer; }
  .r b { font-variant-numeric: tabular-nums; } .r.zero { color: #e5484d; }
  .lbl { background: none; border: 0; box-shadow: none; font-weight: 700; font-size: 11px; text-transform: uppercase; color: #2b2f3a; text-shadow: 0 0 3px #fff, 0 0 3px #fff; text-align: center; white-space: normal; width: 90px; }
  .lbl::before { display: none; }
  .pump { width: 22px; height: 22px; border-radius: 50%; background: #d92d20; border: 2px solid #fff; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .pump.out { background: #8b919f; }
  @media (max-width: 700px) { #wrap { flex-direction: column; } #side { width: auto; height: 38%; border-left: 0; border-top: 1px solid #343946; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="side">
    <h1>Petrol stations by region</h1>
    <p>Source: OpenStreetMap. Red pins are inside a game region, grey pins are outside. Click a row to zoom.</p>
    <div id="list"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../regions.js"></script>
<script src="fuel.js"></script>
<script>
  const map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
  const layers = {};
  const geo = L.geoJSON(window.REGIONS, {
    style: { color: "#3a3f4b", weight: 2, fillColor: "#5b6170", fillOpacity: 0.25 },
    onEachFeature(f, l) { layers[f.properties.name] = l; l.bindTooltip(f.properties.name.replace(/\//g, "/<wbr>"), { permanent: true, direction: "center", className: "lbl" }); },
  }).addTo(map);
  const fitAll = () => { map.invalidateSize(); if (map.getSize().y > 50) map.fitBounds(geo.getBounds(), { padding: [10, 10] }); };
  map.setView([-27.47, 153.03], 13); [0, 300, 1500].forEach((t) => setTimeout(fitAll, t));
  const counts = {}; window.REGIONS.features.forEach((f) => counts[f.properties.name] = 0);
  window.FUEL.forEach((s) => {
    if (s.region) counts[s.region]++;
    const icon = L.divIcon({ className: "", html: '<div class="pump' + (s.region ? "" : " out") + '">P</div>', iconSize: [22, 22], iconAnchor: [11, 11] });
    L.marker([s.lat, s.lon], { icon }).addTo(map).bindPopup("<b>" + s.name + "</b>" + (s.addr ? "<br>" + s.addr : "") + "<br>" + (s.region || "Outside the game area"));
  });
  const list = document.getElementById("list");
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([name, n]) => {
    const d = document.createElement("div"); d.className = "r" + (n ? "" : " zero");
    d.innerHTML = "<span>" + name + "</span><b>" + n + "</b>"; d.onclick = () => map.fitBounds(layers[name].getBounds(), { padding: [30, 30] });
    list.appendChild(d);
  });
</script>
</body>
</html>
